name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    # On main: open or update the "Version packages" pull request from pending changesets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # On a version tag: build binaries, create the GitHub Release, publish to npm.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Package binaries
        run: |
          cd apps/cli/dist/bin
          for target in */; do
            target="${target%/}"
            # No version in the name, so releases/latest/download/<file> is a stable URL.
            tar -czf "mimir-${target}.tar.gz" -C "$target" mimir web
          done
          shasum -a 256 *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/cli/dist/bin/*.tar.gz
            apps/cli/dist/bin/checksums.txt
          generate_release_notes: true
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: apps/cli
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
