name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    # On main: open or update the "Version packages" pull request from pending changesets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    # On a version tag: build the macOS binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
        env:
          MIMIR_TARGETS: bun-darwin-arm64,bun-darwin-x64
      - name: Package
        run: |
          cd apps/cli/dist/bin
          for target in darwin-arm64 darwin-x64; do
            # No version in the name, so releases/latest/download/<file> is a stable URL.
            tar -czf "mimir-${target}.tar.gz" -C "$target" mimir web
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/cli/dist/bin/*.tar.gz

  windows:
    # On a version tag: build mimir.exe on Windows, so it gets its icon and file details.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
        env:
          MIMIR_TARGETS: bun-windows-x64-baseline,bun-windows-arm64
      - name: Package
        shell: pwsh
        run: |
          Set-Location apps\cli\dist\bin
          & .\windows-x64\mimir.exe version
          foreach ($target in @("windows-x64", "windows-arm64")) {
            Compress-Archive -Path "$target\mimir.exe", "$target\web" -DestinationPath "mimir-$target.zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/cli/dist/bin/*.zip

  publish:
    # Create the GitHub Release from both builds, then publish to npm.
    needs: [macos, windows]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum *.tar.gz *.zip > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
          generate_release_notes: true
      - name: Build the npm package
        run: bun run build
        env:
          MIMIR_TARGETS: ""
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: apps/cli
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
